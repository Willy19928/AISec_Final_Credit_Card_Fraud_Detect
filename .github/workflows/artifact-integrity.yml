name: Artifact Integrity

on:
  push:
  pull_request:

jobs:
  verify-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify artifact manifest
        run: python scripts/verify_artifact_manifest.py
