name: Artifact Integrity

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Verify artifact manifest
        run: python scripts/verify_artifact_manifest.py

      - name: Verify notebook parses
        run: python -m json.tool AISec_Final_Credit_Card_Fraud_Detection_NN_MLOps.ipynb > /dev/null

      - name: Verify root and artifact cards are synchronized
        run: python scripts/verify_document_sync.py
